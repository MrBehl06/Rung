<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Rung — one rung at a time. Interview prep sprints for HLD, LLD and DSA." />
    <meta name="color-scheme" content="light dark" />
    <title>Rung</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23111318'/%3E%3Cg stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' fill='none'%3E%3Cpath d='M8 4v16M16 4v16'/%3E%3Cpath d='M8 9h8M8 15h8'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Paint the saved theme before first render so there is no light flash.
      try {
        const raw = localStorage.getItem('hld-lld-tracker/v1');
        const theme = raw ? JSON.parse(raw)?.ui?.theme : null;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
